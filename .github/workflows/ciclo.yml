# Ciclo automático na nuvem: roda de hora em hora (07h–23h de Brasília) e faz o que estiver na hora.
# Estado (roteiros, agenda, áudios) fica no ramo "estado"; imagens e vídeos ficam no cache do Actions.
# Segredos: todos os do repositório viram .env; YOUTUBE_<LANG>_TOKEN viram credentials/youtube_<lang>.token.json
name: Ciclo

on:
  schedule:
    - cron: "5 10-23,0-2 * * *"   # UTC → 07:05 a 23:05 em Brasília
  workflow_dispatch:
    inputs:
      postar_agora:
        description: "Postar já, sem esperar o horário (ex.: instagram:en youtube:pt)"
        required: false
        default: ""

concurrency:
  group: ciclo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: America/Sao_Paulo
      FACELESS_STORAGE: ${{ github.workspace }}/estado
    steps:
      - uses: actions/checkout@v4

      - name: Estado
        uses: actions/checkout@v4
        with:
          ref: estado
          path: estado

      - name: Imagens e vídeos (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            estado/broll
            estado/shorts
          key: midia-${{ github.run_id }}
          restore-keys: midia-

      - name: ffmpeg (cache)
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-1

      - name: Baixar ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=1 -C ~/ffmpeg

      - run: echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Segredos
        # Lista explícita: o GitHub bloqueia como "malicioso" o workflow que despeja todos os segredos
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IG_TOKEN_PT: ${{ secrets.IG_TOKEN_PT }}
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_PT_TOKEN: ${{ secrets.YOUTUBE_PT_TOKEN }}
          YOUTUBE_EN_TOKEN: ${{ secrets.YOUTUBE_EN_TOKEN }}
        run: |
          mkdir -p credentials
          python3 - <<'EOF'
          import os
          NOMES = ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN", "ELEVENLABS_API_KEY", "GEMINI_API_KEY",
                   "GROQ_API_KEY", "PIXABAY_API_KEY", "IG_TOKEN_PT", "IG_TOKEN_EN",
                   "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          with open(".env", "w") as env:
              for nome in NOMES:
                  valor = os.environ.get(nome, "")
                  if valor and "\n" not in valor:
                      env.write(f"{nome}={valor}\n")
          for lang in ("pt", "en"):
              valor = os.environ.get(f"YOUTUBE_{lang.upper()}_TOKEN", "")
              if valor:
                  open(f"credentials/youtube_{lang}.token.json", "w").write(valor)
          EOF

      - name: Ciclo
        env:
          POSTAR_AGORA: ${{ inputs.postar_agora }}
        run: uv run python -m scripts.ciclo

      - name: Guardar imagens e vídeos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            estado/broll
            estado/shorts
          key: midia-${{ github.run_id }}

      - name: Guardar estado
        if: always()
        working-directory: estado
        run: |
          # Log enxuto: só as últimas linhas
          if [ -f logs/pipeline.log ]; then tail -n 4000 logs/pipeline.log > /tmp/log && mv /tmp/log logs/pipeline.log; fi
          git config user.name "ciclo"
          git config user.email "ciclo@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "ciclo $(date '+%d/%m %H:%M')"
          git push -q
