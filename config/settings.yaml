# Configurações gerais + limites pra proteger o PC (GTX 1060 3GB, Ryzen 5 5600GT)

producao:
  shorts_por_dia_por_idioma: 1      # começa leve; sobe pra 2 depois que estabilizar
  idiomas: [pt, es]
  duracao_alvo_seg: [45, 60]
  resolucao: [1080, 1920]           # 9:16 vertical
  fps: 30

seguranca_pc:
  um_video_por_vez: true            # nunca renderiza em paralelo
  prioridade_processo: below_normal # você continua usando o PC normalmente
  ffmpeg_threads: 4                 # de 12 disponíveis
  # NVENC do ffmpeg 9 exige driver 610+, que não existe pra GTX 1060 (Pascal parou no 580).
  # O builder testa e cai pra libx264 sozinho (~90s por Short, com prioridade baixa).
  encoder: h264_nvenc
  whisper: groq                     # whisper-large-v3-turbo na nuvem (grátis); PC não processa nada
  xtts_device: cpu
  docker_mem_limit: 4g              # por container

limpeza:
  apagar_publicados_apos_dias: 7
  apagar_broll_cache_apos_dias: 30
  espaco_minimo_livre_gb: 20        # pipeline pausa se o D: ficar abaixo disso

llm:
  # Escreve, edita e checa os roteiros. Plano grátis do Gemini (modelos Pro não têm cota grátis).
  roteirista: { provider: gemini, model: gemini-3.5-flash }
  # llama-3.3-70b foi descontinuado no Groq; gpt-oss-120b é o substituto mais forte
  primario: { provider: groq, model: openai/gpt-oss-120b }
  fallback: { provider: openai, model: gpt-4o-mini }
