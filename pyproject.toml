requires-python = ">=3.11,<3.12"
dependencies = [
    "groq>=0.11",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pillow>=10.4",
    "streamlit>=1.39",
