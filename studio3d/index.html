<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estúdio 3D</title>
<style>
  @font-face { font-family: "Archivo"; src: url("/assets/fonts/ArchivoBlack-Regular.ttf"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05060f; }
  canvas { position: absolute; inset: 0; }
  #hud { position: absolute; inset: 0; font-family: "Archivo", sans-serif; color: #fff; }

  /* Faixa de papel no topo ("E SE... · A LUA SUMISSE") */
  #faixa { position: absolute; top: 210px; left: 50%; transform: translateX(-50%) rotate(-1.2deg);
           background: #f4ead2; color: #1d1a2e; font-size: 46px; padding: 14px 34px 12px;
           box-shadow: 0 10px 0 rgba(0,0,0,.35); white-space: nowrap; letter-spacing: .5px;
           clip-path: polygon(2% 0, 98% 4%, 100% 50%, 98% 96%, 2% 100%, 0 50%); }
  #faixa .d { color: #d9480f; }

  /* Painel de número grande (contador) */
  #contador { position: absolute; top: 330px; left: 50%; transform: translateX(-50%);
              background: rgba(12, 14, 38, .78); border: 4px solid rgba(255,255,255,.14);
              border-radius: 34px; padding: 24px 60px 26px; text-align: center; min-width: 360px; }
  #contador .n { font-size: 150px; line-height: 1; color: #ffd23f; text-shadow: 0 8px 0 rgba(0,0,0,.35); }
  #contador .r { font-size: 40px; margin-top: 10px; opacity: .9; }

  /* Legenda palavra por palavra */
  #legenda { position: absolute; top: 1290px; left: 50px; right: 50px; text-align: center;
             font-size: 88px; line-height: 1.08; text-transform: uppercase; }
  #legenda span { display: inline-block; margin: 0 10px;
    text-shadow: 0 0 6px #000, 5px 5px 0 #000, -5px 5px 0 #000, 5px -5px 0 #000, -5px -5px 0 #000,
                 0 7px 0 #000, 7px 0 0 #000, -7px 0 0 #000, 0 -7px 0 #000, 0 12px 10px rgba(0,0,0,.6); }
  #legenda span.atual { color: #ffd23f; transform: scale(1.1); }

  #corte { position: absolute; inset: 0; background: #05060f; opacity: 0; }
</style>
</head>
<body>
<canvas id="tela" width="1080" height="1920"></canvas>
<div id="hud">
  <div id="faixa" style="display:none"></div>
  <div id="contador" style="display:none"><div class="n"></div><div class="r"></div></div>
  <div id="legenda"></div>
  <div id="corte"></div>
</div>
<script type="module" src="motor.js"></script>
</body>
</html>
